<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesse AI — Sovereign Intelligence</title>
    <meta name="description" content="Talk to Jesse AI. Voice-first sovereign intelligence by SLMK Jesse Martinez Junior.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <a href="#chat" class="skip-link">Skip to chat</a>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="pulse-dot" aria-hidden="true"></span>
                <span class="brand-name">JESSE AI</span>
            </div>
            <div class="status-pill">LIVE</div>
        </div>
    </header>

    <main id="chat" class="chat-wrap">
        <div class="hero">
            <h1>Talk to <span class="gold">Jesse AI</span></h1>
            <p>Voice-first sovereign intelligence, built by a blind creator for everyone.</p>
        </div>

        <div id="terminal-output" role="region" aria-live="polite" aria-label="Conversation" class="messages"></div>

        <form id="terminal-form" class="composer">
            <label for="terminal-input" class="sr-only">Message Jesse AI</label>
            <input id="terminal-input" type="text" autocomplete="off"
                   placeholder="Message Jesse AI..." aria-label="Message Jesse AI">
            <button type="submit">Send</button>
        </form>
        <p class="hint">Demo only. Full power lives in the main system.</p>
    </main>

    <footer class="footer">
        <p>Jesse AI &amp; SLMK Jesse Martinez Junior</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
